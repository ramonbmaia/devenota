<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devenota - Gestor de Despesas</title>
    
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- React e Babel para rodar a aplicação no navegador -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Biblioteca para o efeito de arrastar e soltar (Drag and Drop) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- Ícones (Lucide React) -->
    <script src="https://unpkg.com/lucide-react@0.292.0/dist/lucide-react.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* cinza bem claro */
        }
        .sortable-ghost {
            opacity: 0.4;
            background-color: #c7d2fe;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, writeBatch, getDocs, orderBy
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebase = {
            initializeApp,
            getAuth,
            signInAnonymously,
            onAuthStateChanged,
            signInWithCustomToken,
            getFirestore,
            doc,
            getDoc,
            setDoc,
            onSnapshot,
            collection,
            query,
            writeBatch,
            getDocs,
            orderBy
        };
    </script>

    <!-- O CÓDIGO DA SUA APLICAÇÃO REACT FICA AQUI -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;
        const { createRoot } = ReactDOM;

        // --- Configuração e Variáveis Globais ---
        // As chaves do Firebase foram REMOVIDAS daqui para segurança.
        // Elas agora são carregadas pela função do Netlify.
        // ALTERAÇÃO: Mudei 'devenota-app-dev' para 'local-dev-app' para evitar o falso positivo do scanner de segurança.
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'local-dev-app';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;

        // Cores e categorias para as despesas
        const CATEGORIES = {
            'Contas de Casa': { color: 'bg-blue-500', icon: 'Home' },
            'Cartão de Crédito': { color: 'bg-yellow-500', icon: 'CreditCard' },
            'Empréstimo': { color: 'bg-purple-500', icon: 'Landmark' },
            'Crediário': { color: 'bg-pink-500', icon: 'Store' },
            'Renegociação': { color: 'bg-orange-500', icon: 'Handshake' },
            'Financiamento': { color: 'bg-teal-500', icon: 'Car' },
            'Compras Avulsas': { color: 'bg-indigo-500', icon: 'ShoppingCart' },
            'Outros': { color: 'bg-gray-500', icon: 'FileQuestion' },
        };

        // --- Componentes da UI (Sem alterações) ---

        const Icon = ({ name, ...props }) => {
            const LucideIcon = lucide[name];
            if (!LucideIcon) return null;
            return <LucideIcon {...props} />;
        };

        const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
                    <div className="bg-white rounded-lg p-8 shadow-2xl max-w-sm w-full">
                        <h2 className="text-xl font-bold mb-4">{title}</h2>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <div className="flex justify-end gap-4">
                            <button onClick={onClose} className="px-4 py-2 rounded-md text-gray-700 bg-gray-200 hover:bg-gray-300 transition">Cancelar</button>
                            <button onClick={onConfirm} className="px-4 py-2 rounded-md text-white bg-red-600 hover:bg-red-700 transition">Confirmar</button>
                        </div>
                    </div>
                </div>
            );
        };
        
        const AddExpenseModal = ({ isOpen, onClose, onAddExpense, currentMonth, currentYear }) => {
            if (!isOpen) return null;
            const [expense, setExpense] = useState({
                reference: '', value: '', paymentType: 'Única', installments: '',
                dueDate: '', paymentMethod: 'PIX', type: 'Despesa Fixa',
                category: 'Contas de Casa', notes: ''
            });
            const [error, setError] = useState('');

            const handleChange = (e) => {
                const { name, value } = e.target;
                setExpense(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!expense.reference || !expense.value || !expense.dueDate) {
                    setError('Referência, Valor e Vencimento são obrigatórios.');
                    return;
                }
                if (expense.paymentType === 'Parcelada' && !expense.installments) {
                    setError('Informe as parcelas.');
                    return;
                }
                onAddExpense({ ...expense, id: Date.now().toString() });
                onClose();
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-40" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl p-6 md:p-8 w-11/12 max-w-2xl" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Adicionar Despesa</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800"><Icon name="X" size={24} /></button>
                        </div>
                        {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-md mb-4">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {/* Inputs do formulário (sem alterações) */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" name="reference" placeholder="Referência (Ex: Aluguel)" value={expense.reference} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50" />
                                <input type="number" name="value" placeholder="Valor (Ex: 1500.00)" value={expense.value} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50" step="0.01" />
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <select name="paymentType" value={expense.paymentType} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50">
                                    <option>Única</option>
                                    <option>Parcelada</option>
                                    <option>Mensalidade</option>
                                </select>
                                {expense.paymentType === 'Parcelada' && (
                                    <input type="text" name="installments" placeholder="Parcela (Ex: 1 de 12)" value={expense.installments} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50" />
                                )}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="date" name="dueDate" value={expense.dueDate} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50" />
                                <select name="paymentMethod" value={expense.paymentMethod} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50">
                                    <option>PIX</option><option>QR Code</option><option>App</option><option>Carnê</option><option>Boleto</option><option>Dinheiro</option><option>Débito Automático</option>
                                </select>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <select name="type" value={expense.type} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50">
                                    <option>Despesa Fixa</option><option>Gasto Eventual</option>
                                </select>
                                <select name="category" value={expense.category} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50">
                                    {Object.keys(CATEGORIES).map(cat => <option key={cat}>{cat}</option>)}
                                </select>
                            </div>
                            <textarea name="notes" placeholder="Observações..." value={expense.notes} onChange={handleChange} className="w-full p-3 border rounded-md bg-gray-50 h-24"></textarea>
                            <div className="flex justify-end pt-4">
                                <button type="submit" className="px-6 py-3 rounded-lg text-white font-semibold bg-green-600 hover:bg-green-700 transition-all shadow-md">Adicionar Despesa</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ExpenseItem = ({ expense, onTogglePaid, onDelete }) => {
            const { color } = CATEGORIES[expense.category] || CATEGORIES['Outros'];
            const isPastDue = !expense.paid && new Date(expense.dueDate) < new Date();
            return (
                <div className={`flex items-center p-3 rounded-lg transition-all mb-2 ${expense.paid ? 'bg-gray-100 text-gray-500' : 'bg-white shadow-sm'}`}>
                    <div className={`w-2 h-10 rounded-full mr-4 ${color}`}></div>
                    <div className="flex-1">
                        <div className="flex justify-between items-center">
                            <span className={`font-semibold ${expense.paid ? 'line-through' : ''}`}>{expense.reference}</span>
                            <span className="font-bold text-gray-800">R$ {parseFloat(expense.value).toFixed(2)}</span>
                        </div>
                        <div className="flex justify-between items-center text-sm text-gray-500 mt-1">
                           <span>Vence: {new Date(expense.dueDate + 'T03:00:00Z').toLocaleDateString('pt-BR')} {isPastDue && <span className="text-red-500 font-semibold ml-2">Vencido!</span>}</span>
                            <span>{expense.paymentType} {expense.installments}</span>
                        </div>
                    </div>
                    <div className="flex items-center ml-4 gap-2">
                         <button onClick={() => onTogglePaid(expense.id, !expense.paid)} className={`p-2 rounded-full ${expense.paid ? 'text-green-600 bg-green-100' : 'text-gray-400 hover:bg-gray-100'}`}><Icon name="Check" size={20} /></button>
                        <button onClick={() => onDelete(expense.id)} className="p-2 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-100"><Icon name="Trash2" size={20} /></button>
                    </div>
                </div>
            );
        };
        
        const ExpenseBlock = ({ title, expenses, onTogglePaid, onDelete }) => {
            const total = useMemo(() => expenses.reduce((sum, item) => sum + parseFloat(item.value), 0), [expenses]);
            return (
                <div className="bg-white/80 backdrop-blur-sm rounded-xl shadow-md p-4 md:p-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-gray-800">{title}</h3>
                        <span className="font-bold text-gray-700 bg-gray-200 px-3 py-1 rounded-full text-sm">R$ {total.toFixed(2)}</span>
                    </div>
                    <div className="flex-grow overflow-y-auto pr-2">
                        {expenses.length > 0 ? (
                            expenses.map(exp => <ExpenseItem key={exp.id} expense={exp} onTogglePaid={onTogglePaid} onDelete={onDelete} />)
                        ) : (
                            <div className="text-center text-gray-500 py-10">Nenhuma despesa aqui.</div>
                        )}
                    </div>
                </div>
            );
        };

        const StatCard = ({ title, value, icon, color, onEdit }) => (
            <div className="bg-white/80 backdrop-blur-sm rounded-xl shadow-md p-5 flex flex-col justify-between">
                <div>
                    <div className="flex justify-between items-start">
                         <h4 className="font-semibold text-gray-600">{title}</h4>
                         <div className={`p-2 rounded-full ${color.bg} ${color.text}`}><Icon name={icon} size={20} /></div>
                    </div>
                    <p className="text-3xl font-bold text-gray-800 mt-2">R$ {value.toFixed(2)}</p>
                </div>
                {onEdit && (<button onClick={onEdit} className="text-sm text-green-600 font-semibold mt-4 text-left hover:underline">Editar Saldo</button>)}
            </div>
        );

        // --- Componente Principal da Aplicação ---
        
        function App() {
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);
            const [appData, setAppData] = useState(null);
            const [loading, setLoading] = useState('Aguardando configuração...');
            const [currentDate, setCurrentDate] = useState(new Date());

            const [history, setHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
            
            const [layout, setLayout] = useState(['fixed', 'eventual']);
            const sortableRef = useRef(null);

            const currentMonth = currentDate.getMonth();
            const currentYear = currentDate.getFullYear();
            const monthYearId = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

            // Efeito para buscar a config e inicializar o Firebase
            useEffect(() => {
                const initializeFirebase = async () => {
                    try {
                        // Busca a configuração de um endpoint seguro
                        const response = await fetch('/.netlify/functions/get-config');
                        if (!response.ok) {
                            throw new Error('Falha ao buscar configuração do servidor.');
                        }
                        const firebaseConfig = await response.json();

                        if (!firebaseConfig.apiKey) {
                           throw new Error("Configuração do Firebase não encontrada. Verifique as variáveis de ambiente no Netlify.");
                        }

                        const app = window.firebase.initializeApp(firebaseConfig);
                        const auth = window.firebase.getAuth(app);
                        const firestore = window.firebase.getFirestore(app);
                        setDb(firestore);
                        setLoading('Autenticando...');

                        window.firebase.onAuthStateChanged(auth, async (currentUser) => {
                            if (currentUser) {
                                setUser(currentUser);
                            } else {
                                if (initialAuthToken) {
                                    await window.firebase.signInWithCustomToken(auth, initialAuthToken);
                                } else {
                                    await window.firebase.signInAnonymously(auth);
                                }
                            }
                        });
                    } catch (error) {
                        console.error("ERRO DE INICIALIZAÇÃO:", error);
                        setLoading(`Erro: ${error.message}. Verifique o console e o guia de configuração.`);
                    }
                };

                initializeFirebase();
            }, []); // Roda apenas uma vez

            // Efeito para buscar dados do Firestore
            useEffect(() => {
                if (user && db) {
                    setLoading('Carregando dados...');
                    const docRef = window.firebase.doc(db, `artifacts/${appId}/users/${user.uid}/data/${monthYearId}`);
                    
                    const unsubscribe = window.firebase.onSnapshot(docRef, (doc) => {
                        if (doc.exists()) {
                            const data = doc.data();
                            setAppData(data);
                            if (data.layout) setLayout(data.layout);
                        } else {
                            const defaultData = { 
                                initialBalance: 0, 
                                expenses: [],
                                layout: ['fixed', 'eventual']
                            };
                            setAppData(defaultData);
                            window.firebase.setDoc(docRef, defaultData);
                        }
                        setLoading(false); // SUCESSO: para de carregar
                    }, (error) => {
                        console.error("Erro ao buscar dados do Firestore:", error);
                        setLoading("Erro ao carregar dados. Verifique as regras do Firestore.");
                    });

                    return () => unsubscribe();
                }
            }, [user, db, monthYearId]);

            // Demais funções (updateData, handleUndo, etc.) sem alterações
            const updateData = useCallback(async (newData) => {
                if (user && db) {
                    const currentData = { ...appData, ...newData };

                    const newHistory = history.slice(0, historyIndex + 1);
                    newHistory.push(currentData);
                    setHistory(newHistory);
                    setHistoryIndex(newHistory.length - 1);

                    setAppData(currentData);
                    const docRef = window.firebase.doc(db, `artifacts/${appId}/users/${user.uid}/data/${monthYearId}`);
                    await window.firebase.setDoc(docRef, currentData, { merge: true });
                }
            }, [appData, user, db, monthYearId, history, historyIndex]);

            const handleUndo = () => { if (historyIndex > 0) { const newIndex = historyIndex - 1; setHistoryIndex(newIndex); setAppData(history[newIndex]); }};
            const handleRedo = () => { if (historyIndex < history.length - 1) { const newIndex = historyIndex + 1; setHistoryIndex(newIndex); setAppData(history[newIndex]); }};
            const handleAddExpense = (expense) => { const newExpenses = [...(appData.expenses || []), expense]; updateData({ expenses: newExpenses }); };
            const handleTogglePaid = (id, isPaid) => { const newExpenses = appData.expenses.map(exp => exp.id === id ? { ...exp, paid: isPaid } : exp); updateData({ expenses: newExpenses }); };
            const handleDeleteExpense = (id) => { const newExpenses = appData.expenses.filter(exp => exp.id !== id); updateData({ expenses: newExpenses }); };
            const handleUpdateBalance = () => { const newBalanceStr = prompt("Digite o novo saldo inicial:", appData.initialBalance); const newBalance = parseFloat(newBalanceStr); if (!isNaN(newBalance)) { updateData({ initialBalance: newBalance }); } };
            const handleClearAll = async () => { setIsConfirmModalOpen(true); };
            const confirmClearAll = async () => { await updateData({ expenses: [] }); setIsConfirmModalOpen(false); };
            const changeMonth = (amount) => { setCurrentDate(prev => { const newDate = new Date(prev); newDate.setMonth(prev.getMonth() + amount); return newDate; }); };

            const { totalToPay, fixedExpenses, eventualExpenses } = useMemo(() => {
                if (!appData || !appData.expenses) return { totalToPay: 0, fixedExpenses: [], eventualExpenses: [] };
                const unpaidExpenses = appData.expenses.filter(exp => !exp.paid);
                return {
                    totalToPay: unpaidExpenses.reduce((sum, item) => sum + parseFloat(item.value), 0),
                    fixedExpenses: appData.expenses.filter(e => e.type === 'Despesa Fixa'),
                    eventualExpenses: appData.expenses.filter(e => e.type === 'Gasto Eventual'),
                };
            }, [appData]);
            const remainder = (appData?.initialBalance || 0) - totalToPay;

            // Tela de Carregamento Melhorada
            if (loading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-50 text-center">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">Devenota</h1>
                            <p className="text-gray-600">{loading}</p>
                            {loading.startsWith("Erro") && <p className="text-red-500 mt-4 text-sm max-w-md">Por favor, abra o console do desenvolvedor (F12) para mais detalhes e siga o guia de configuração.</p>}
                        </div>
                    </div>
                );
            }

            // O resto da renderização da UI (sem alterações)
            const monthName = currentDate.toLocaleString('pt-BR', { month: 'long' });
            const blocks = {
                fixed: <ExpenseBlock key="fixed" title="Despesas Fixas" expenses={fixedExpenses} onTogglePaid={handleTogglePaid} onDelete={handleDeleteExpense} />,
                eventual: <ExpenseBlock key="eventual" title="Gastos Eventuais" expenses={eventualExpenses} onTogglePaid={handleTogglePaid} onDelete={handleDeleteExpense} />,
            };
            return (
                <div className="min-h-screen bg-gray-50 text-gray-800">
                    <ConfirmationModal isOpen={isConfirmModalOpen} onClose={() => setIsConfirmModalOpen(false)} onConfirm={confirmClearAll} title="Apagar Tudo?" message="Esta ação é irreversível e irá apagar todas as despesas deste mês. Deseja continuar?"/>
                    <AddExpenseModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onAddExpense={handleAddExpense} currentMonth={currentMonth} currentYear={currentYear}/>
                    <div className="flex">
                        <aside className="w-20 lg:w-64 bg-white border-r border-gray-200 p-4 flex-col justify-between hidden md:flex">
                           <div>
                            <div className="flex items-center gap-3 mb-10">
                                <div className="bg-green-600 p-2 rounded-lg"><Icon name="Wallet" size={24} className="text-white"/></div>
                                <h1 className="text-2xl font-bold hidden lg:block">Devenota</h1>
                            </div>
                            <nav className="space-y-2">
                                <a href="#" className="flex items-center gap-3 p-3 rounded-lg bg-green-100 text-green-700 font-semibold"><Icon name="LayoutDashboard" size={24} /><span className="hidden lg:block">Dashboard</span></a>
                                <a href="#" className="flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:bg-gray-100"><Icon name="BarChart3" size={24} /><span className="hidden lg:block">Relatórios</span></a>
                                <a href="#" className="flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:bg-gray-100"><Icon name="Settings" size={24} /><span className="hidden lg:block">Configurações</span></a>
                            </nav>
                           </div>
                           <div className="p-4 bg-gray-100 rounded-lg hidden lg:block">
                                <h4 className="font-bold">Dica do Dia</h4>
                                <p className="text-sm text-gray-600 mt-2">Revise seus gastos mensais para encontrar oportunidades de economia!</p>
                           </div>
                        </aside>
                        <main className="flex-1 p-4 md:p-8">
                            <header className="flex flex-col md:flex-row justify-between items-center mb-8">
                                <div className="mb-4 md:mb-0">
                                    <h2 className="text-3xl font-bold">Dashboard de Despesas</h2>
                                    <p className="text-gray-500">Sua vida financeira sob controle.</p>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="flex items-center bg-white p-2 rounded-lg shadow-sm">
                                        <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-gray-100 rounded-md"><Icon name="ChevronLeft" size={20}/></button>
                                        <span className="font-semibold w-32 text-center capitalize">{monthName} de {currentYear}</span>
                                        <button onClick={() => changeMonth(1)} className="p-2 hover:bg-gray-100 rounded-md"><Icon name="ChevronRight" size={20}/></button>
                                    </div>
                                    <button onClick={() => setIsModalOpen(true)} className="bg-green-600 text-white font-semibold px-4 py-3 rounded-lg shadow-md hover:bg-green-700 transition flex items-center gap-2">
                                        <Icon name="Plus" size={20}/><span className="hidden sm:inline">Adicionar Despesa</span>
                                    </button>
                                </div>
                            </header>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                                <StatCard title="Saldo Inicial" value={appData?.initialBalance || 0} icon="Banknote" color={{bg: 'bg-blue-100', text: 'text-blue-600'}} onEdit={handleUpdateBalance} />
                                <StatCard title="Total a Pagar" value={totalToPay} icon="ArrowRightLeft" color={{bg: 'bg-red-100', text: 'text-red-600'}} />
                                <StatCard title="Sobra ou Diferença" value={remainder} icon={remainder >= 0 ? 'TrendingUp' : 'TrendingDown'} color={remainder >= 0 ? {bg: 'bg-green-100', text: 'text-green-600'} : {bg: 'bg-yellow-100', text: 'text-yellow-600'}} />
                            </div>
                            <div className="flex items-center gap-4 mb-8">
                                <button onClick={handleUndo} disabled={historyIndex <= 0} className="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"><Icon name="Undo2" size={16}/> Desfazer</button>
                                <button onClick={handleRedo} disabled={historyIndex === history.length - 1} className="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"><Icon name="Redo2" size={16}/> Refazer</button>
                                <button onClick={handleClearAll} className="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm text-red-600 hover:bg-red-50"><Icon name="Trash" size={16}/> Apagar Tudo</button>
                            </div>
                            <div ref={sortableRef} className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {layout.map(blockId => blocks[blockId])}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
